<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - Auto Order</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <h1>🔐 Admin Login</h1>
  <input type="password" id="passwordInput" placeholder="Masukkan password">
  <button onclick="login()">Masuk</button>
  <p class="err" id="loginErr"></p>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard" style="display:none;">

  <header class="dash-header">
    <h1>📊 Dashboard Order</h1>
    <div>
      <button onclick="loadOrders()" class="btn-refresh">🔄 Refresh</button>
      <button onclick="logout()" class="btn-logout">Logout</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card">
      <span class="stat-label">Total Order</span>
      <span class="stat-value" id="statTotal">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Pending</span>
      <span class="stat-value" id="statPending">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Selesai</span>
      <span class="stat-value" id="statSelesai">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Total Pendapatan</span>
      <span class="stat-value" id="statPendapatan">Rp 0</span>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 Cari nama / produk / order ID...">
    <select id="filterStatus">
      <option value="">Semua Status</option>
      <option value="Pending">Pending</option>
      <option value="Diproses">Diproses</option>
      <option value="Selesai">Selesai</option>
      <option value="Dibatalkan">Dibatalkan</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="orderTable">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Tanggal</th>
          <th>Nama</th>
          <th>WA</th>
          <th>Produk</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Pembayaran</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="orderBody">
        <tr><td colspan="10" class="empty">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
