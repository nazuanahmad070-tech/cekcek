<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Order - Toko Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🛒 Auto <span>Order</span></h1>

  <form id="orderForm">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Masukkan nama" required>
    </div>

    <div class="form-group">
      <label>No. WhatsApp</label>
      <input type="tel" id="wa" placeholder="08xxxxxxxxxx" required>
    </div>

    <div class="form-group">
      <label>Alamat Pengiriman</label>
      <textarea id="alamat" rows="2" placeholder="Alamat lengkap" required></textarea>
    </div>

    <div class="form-group">
      <label>Pilih Produk</label>
      <div class="produk-list" id="produkList">
        <div class="produk-item" data-nama="Kaos Polos" data-harga="50000">
          Kaos Polos <span class="harga">Rp 50.000</span>
        </div>
        <div class="produk-item" data-nama="Hoodie" data-harga="150000">
          Hoodie <span class="harga">Rp 150.000</span>
        </div>
        <div class="produk-item" data-nama="Topi" data-harga="35000">
          Topi <span class="harga">Rp 35.000</span>
        </div>
        <div class="produk-item" data-nama="Tas" data-harga="120000">
          Tas <span class="harga">Rp 120.000</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Jumlah</label>
      <input type="number" id="jumlah" value="1" min="1" required>
    </div>

    <div class="form-group">
      <label>Metode Pembayaran</label>
      <select id="bayar" required>
        <option value="">-- Pilih --</option>
        <option value="Transfer Bank">Transfer Bank</option>
        <option value="COD">COD (Bayar di Tempat)</option>
        <option value="E-Wallet">E-Wallet (Dana/OVO)</option>
      </select>
    </div>

    <div class="total-box">
      <span>Total Bayar:</span>
      <span class="total-harga" id="totalHarga">Rp 0</span>
    </div>

    <button type="submit" id="btnSubmit">🚀 Pesan Sekarang</button>
  </form>

  <div class="notif" id="notif">✅ Pesanan berhasil dikirim!</div>

  <a href="admin.html" class="admin-link">🔐 Dashboard Admin</a>
</div>

<script src="script.js"></script>
</body>
</html>
