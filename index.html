<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Order - Toko Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    width: 100%;
    max-width: 500px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    padding: 30px;
  }
  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
    font-size: 24px;
  }
  h1 span { color: #667eea; }
  .form-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-size: 14px;
    font-weight: 600;
  }
  input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.3s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #667eea;
    outline: none;
  }
  .produk-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
  }
  .produk-item {
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    font-size: 13px;
  }
  .produk-item:hover, .produk-item.active {
    border-color: #667eea;
    background: #f0f4ff;
  }
  .produk-item .harga {
    color: #667eea;
    font-weight: bold;
    display: block;
    margin-top: 4px;
  }
  .total-box {
    background: #f0f4ff;
    padding: 15px;
    border-radius: 8px;
    margin: 15px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    color: #333;
  }
  .total-box .total-harga {
    color: #667eea;
    font-size: 20px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102,126,234,0.4);
  }
  .notif {
    display: none;
    background: #d4edda;
    color: #155724;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🛒 Auto <span>Order</span></h1>

  <form id="orderForm">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Masukkan nama" required>
    </div>

    <div class="form-group">
      <label>No. WhatsApp</label>
      <input type="tel" id="wa" placeholder="08xxxxxxxxxx" required>
    </div>

    <div class="form-group">
      <label>Alamat Pengiriman</label>
      <textarea id="alamat" rows="2" placeholder="Alamat lengkap" required></textarea>
    </div>

    <div class="form-group">
      <label>Pilih Produk</label>
      <div class="produk-list" id="produkList">
        <div class="produk-item" data-nama="Kaos Polos" data-harga="50000">
          Kaos Polos <span class="harga">Rp 50.000</span>
        </div>
        <div class="produk-item" data-nama="Hoodie" data-harga="150000">
          Hoodie <span class="harga">Rp 150.000</span>
        </div>
        <div class="produk-item" data-nama="Topi" data-harga="35000">
          Topi <span class="harga">Rp 35.000</span>
        </div>
        <div class="produk-item" data-nama="Tas" data-harga="120000">
          Tas <span class="harga">Rp 120.000</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Jumlah</label>
      <input type="number" id="jumlah" value="1" min="1" required>
    </div>

    <div class="form-group">
      <label>Metode Pembayaran</label>
      <select id="bayar" required>
        <option value="">-- Pilih --</option>
        <option value="Transfer Bank">Transfer Bank</option>
        <option value="COD">COD (Bayar di Tempat)</option>
        <option value="E-Wallet">E-Wallet (Dana/OVO)</option>
      </select>
    </div>

    <div class="total-box">
      <span>Total Bayar:</span>
      <span class="total-harga" id="totalHarga">Rp 0</span>
    </div>

    <button type="submit">🚀 Pesan Sekarang</button>
  </form>

  <div class="notif" id="notif">✅ Pesanan berhasil dikirim!</div>
</div>

<script>
  const produkItems = document.querySelectorAll('.produk-item');
  const jumlahInput = document.getElementById('jumlah');
  const totalHargaEl = document.getElementById('totalHarga');
  let produkTerpilih = null;

  // Pilih produk
  produkItems.forEach(item => {
    item.addEventListener('click', () => {
      produkItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      produkTerpilih = {
        nama: item.dataset.nama,
        harga: parseInt(item.dataset.harga)
      };
      hitungTotal();
    });
  });

  // Hitung total
  jumlahInput.addEventListener('input', hitungTotal);

  function hitungTotal() {
    if (!produkTerpilih) {
      totalHargaEl.textContent = 'Rp 0';
      return;
    }
    const jumlah = parseInt(jumlahInput.value) || 1;
    const total = produkTerpilih.harga * jumlah;
    totalHargaEl.textContent = 'Rp ' + total.toLocaleString('id-ID');
  }

  // Submit form
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();

    if (!produkTerpilih) {
      alert('Silakan pilih produk terlebih dahulu!');
      return;
    }

    const nama = document.getElementById('nama').value;
    const wa = document.getElementById('wa').value;
    const alamat = document.getElementById('alamat').value;
    const jumlah = jumlahInput.value;
    const bayar = document.getElementById('bayar').value;
    const total = produkTerpilih.harga * jumlah;

    // Format pesan WhatsApp
    const pesan = 
`🛒 *PESANAN BARU*
━━━━━━━━━━━━━━━
👤 Nama: ${nama}
📱 WA: ${wa}
📍 Alamat: ${alamat}
━━━━━━━━━━━━━━━
📦 Produk: ${produkTerpilih.nama}
🔢 Jumlah: ${jumlah}
💰 Total: Rp ${total.toLocaleString('id-ID')}
💳 Pembayaran: ${bayar}
━━━━━━━━━━━━━━━
Mohon diproses ya 🙏`;

    // Ganti nomor di bawah dengan nomor WA admin
    const nomorAdmin = '6288225731448';
    const url = `https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`;
    window.open(url, '_blank');

    // Tampilkan notifikasi
    const notif = document.getElementById('notif');
    notif.style.display = 'block';
    setTimeout(() => notif.style.display = 'none', 3000);

    // Reset form
    this.reset();
    produkItems.forEach(i => i.classList.remove('active'));
    produkTerpilih = null;
    totalHargaEl.textContent = 'Rp 0';
  });
</script>

</body>
</html>
